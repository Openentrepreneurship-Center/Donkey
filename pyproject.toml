[project]
name = "donkey"
version = "0.1.0"
description = "Medical audio transcription with speaker diarization and SOAP summarization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "pydub>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[project.scripts]
donkey = "donkey.cli:main"
donkey-server = "donkey.api.main:run_server"

[tool.uv]
package = true

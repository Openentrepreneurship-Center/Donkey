# 로컬/스테이징용. 프로덕션은 외부 Redis·시크릿에 맞게 environment만 조정.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # .env의 localhost Redis를 덮어 compose 네트워크에서 redis 서비스로 접속
      REDIS_URL: redis://redis:6379/0
      USE_ARQ_QUEUE: "true"
    depends_on:
      - redis
    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  worker:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      USE_ARQ_QUEUE: "true"
    depends_on:
      - redis
    command:
      - uv
      - run
      - arq
      - app.arq_worker.WorkerSettings

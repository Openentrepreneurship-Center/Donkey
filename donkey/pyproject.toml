[project]
name = "donkey"
version = "0.1.0"
description = "Medical audio processing pipeline with speaker diarization and SOAP summarization"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pyannote-audio>=3.1.0,<4.0",
    "huggingface_hub<1.0",
    "torch>=2.0.0,<2.6",
    "torchaudio>=2.0.0,<2.6",
    "pydub>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project]
name = "donkey"
version = "0.1.0"
description = "Medical audio processing pipeline with speaker diarization and SOAP summarization"
requires-python = ">=3.10"
dependencies = [
    "kiwipiepy>=0.22.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pydub>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "boto3>=1.34.0",
    "librosa>=0.10.0",
    "scikit-learn>=1.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncmy>=0.2.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "arq>=0.27.0",
]

[project.scripts]
donkey-metrics = "app.metrics.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:pydub.utils",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/metrics/*"]

[tool.coverage.report]
fail_under = 0

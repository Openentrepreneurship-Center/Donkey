name: FastAPI CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 프로젝트 패키지 등록 (중요)
        run: pip install -e .

      - name: 문법 검사
        run: python -m py_compile $(git ls-files '*.py')

      - name: FastAPI 앱 import 확인
        run: |
          python - <<EOF
          from donkey.main import app
          print("FastAPI app import 성공")
          EOF

      - name: Lint 검사
        run: |
          pip install flake8
          flake8 .

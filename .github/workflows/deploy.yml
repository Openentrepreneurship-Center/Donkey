name: Deploy to EC2

on:
  push:
    branches: [main, develop]

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: donkey

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build and push Docker image
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f donkey/Dockerfile donkey/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 5. Get EC2 Instance ID by tag
      - name: Get EC2 Instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=dev" "Name=tag:Project,Values=donkey" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Error: Could not find running EC2 instance with Environment=dev tag"
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found instance: $INSTANCE_ID"

      # 6. Get DATABASE_URL, S3_LOGS_BUCKET from SSM
      - name: Get SSM parameters
        id: get-ssm
        run: |
          DATABASE_URL=$(aws ssm get-parameter --name "/donkey/DATABASE_URL" --with-decryption --query Parameter.Value --output text 2>/dev/null || true)
          S3_LOGS_BUCKET=$(aws ssm get-parameter --name "/donkey/S3_LOGS_BUCKET" --query Parameter.Value --output text 2>/dev/null || true)
          echo "database_url<<EOF" >> $GITHUB_OUTPUT
          echo "$DATABASE_URL" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "s3_logs_bucket=$S3_LOGS_BUCKET" >> $GITHUB_OUTPUT

      # 7. Deploy to EC2 via SSM
      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          INSTANCE_ID: ${{ steps.get-instance.outputs.instance_id }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DATABASE_URL: ${{ steps.get-ssm.outputs.database_url }}
          S3_LOGS_BUCKET: ${{ steps.get-ssm.outputs.s3_logs_bucket }}
        run: |
          # EC2에서 실행할 블루–그린 배포 스크립트 (API: 후보 기동 → 헬스 → Caddy reload → 승격)
          DEPLOY_SCRIPT_B64=$(base64 -w0 scripts/ec2-deploy.sh)
          COMMANDS=$(jq -n \
            --arg b64 "$DEPLOY_SCRIPT_B64" \
            --arg ecr "$ECR_REGISTRY" \
            --arg envfile "$ENV_FILE" \
            --arg dburl "$DATABASE_URL" \
            --arg s3bucket "$S3_LOGS_BUCKET" \
            '[
              "set -e",
              "echo Starting blue-green deployment...",
              "echo " + ($b64 | @sh) + " | base64 -d > /tmp/donkey-deploy.sh",
              "chmod +x /tmp/donkey-deploy.sh",
              "echo " + ($envfile | @sh) + " > /home/ec2-user/.env",
              (if ($dburl | length) > 0 then "echo DATABASE_URL=" + ($dburl | @sh) + " >> /home/ec2-user/.env" else empty end),
              (if ($s3bucket | length) > 0 then "echo S3_LOGS_BUCKET=" + ($s3bucket | @sh) + " >> /home/ec2-user/.env" else empty end),
              "export ECR_REGISTRY=" + ($ecr | @sh),
              "bash /tmp/donkey-deploy.sh"
            ]')

          # Send command via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          echo "Waiting for deployment to complete..."
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out"
          exit 1
